# Exact versions the tests pass with (Mac, Boom Box 1.3.4). Install_BoomBox updates an
# existing environment to these in place. Change a version only after testing it.
name: boombox
channels:
  - conda-forge
dependencies:
  - python=3.11.18
  - numpy=2.4.6
  - pillow=13.0.0
  - tk=8.6.13
  - ffmpeg=9.0.2
  - python-sounddevice=0.5.6
  - pysoundfile=0.14.0
  - pyusb=1.3.1
  - libusb=1.0.30
  - pip=26.2.2
  - pip:
      - opencv-python-headless==4.14.0.94   # camera capture (AVFoundation)
